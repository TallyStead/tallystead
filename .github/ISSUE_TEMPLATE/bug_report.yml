name: Bug report
description: Report a reproducible problem using fictional or sanitized information.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Never include real financial data, credentials, session tokens, household exports, receipts, statements, backups, or private logs. Report security vulnerabilities privately through the security policy.
  - type: input
    id: version
    attributes:
      label: Tallystead version
      description: Provide the server release, container tag, or commit.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or upgrade
        - Authentication or household access
        - Accounts or transactions
        - Bills, income, debt, or calendar
        - Imports or reconciliation
        - Documents, email, or local AI
        - Planner, goals, or reports
        - Backup, restore, or data management
        - Networking, certificates, or proxying
        - Other server behavior
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem without private household information.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use fictional values and include the smallest reliable sequence.
      placeholder: |
        1. Start from...
        2. Perform...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Installation environment
      description: Include operating system, CPU architecture, Docker/Compose versions, and relevant proxy topology.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Share only the minimum sanitized error text or fictional-data screenshot needed to understand the problem.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed all real household, financial, credential, and identifying information.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true

