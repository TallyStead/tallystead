version: 2
multi-ecosystem-groups:
  container-images:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      routine-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      routine-python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /apps/api
    patterns: ["*"]
    multi-ecosystem-group: container-images
  - package-ecosystem: docker
    directory: /infrastructure/backup
    patterns: ["*"]
    multi-ecosystem-group: container-images
  - package-ecosystem: docker
    directory: /infrastructure/compose
    patterns: ["*"]
    multi-ecosystem-group: container-images
